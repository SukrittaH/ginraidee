apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyVault.secretProviderClass }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recipe-service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: {{ .Values.keyVault.usePodIdentity | quote }}
    useVMManagedIdentity: {{ .Values.keyVault.useVMManagedIdentity | quote }}
    clientID: {{ index .Values.serviceAccount.annotations "azure.workload.identity/client-id" | quote }}
    keyvaultName: {{ .Values.keyVault.name }}
    tenantId: {{ .Values.keyVault.tenantId }}
    objects: |
      array:
      {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType }}
          objectAlias: {{ .secretName }}
      {{- end }}
      {{- if .Values.observability.enabled }}
        - |
          objectName: {{ .Values.observability.signozToken.objectName }}
          objectType: secret
          objectAlias: {{ .Values.observability.signozToken.secretName }}
      {{- end }}
  # Sync secrets to Kubernetes Secret for envFrom
  secretObjects:
    - secretName: {{ include "recipe-service.fullname" . }}-secrets
      type: Opaque
      data:
      {{- range .Values.keyVault.secrets }}
        - objectName: {{ .secretName }}
          key: {{ .secretName | upper | replace "-" "_" }}
      {{- end }}
      {{- if .Values.observability.enabled }}
        - objectName: {{ .Values.observability.signozToken.secretName }}
          key: {{ .Values.observability.signozToken.secretName | upper | replace "-" "_" }}
      {{- end }}
