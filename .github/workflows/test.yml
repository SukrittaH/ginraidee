name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Unit Tests (Fast, runs in parallel for all services)
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, inventory-service, ocr-service, recipe-service]
      fail-fast: false # Continue testing other services even if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: npm run test:unit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-do-not-use-in-production
          VAULT_ENABLED: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: services/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}-unit
          name: ${{ matrix.service }}-unit-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 2: Integration Tests (Requires database)
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ginraidee_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        service: [auth-service, inventory-service, ocr-service, recipe-service]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run integration tests
        working-directory: services/${{ matrix.service }}
        run: npm run test:integration
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/ginraidee_test
          JWT_SECRET: test-secret-key-do-not-use-in-production
          VAULT_ENABLED: false
          # Mock Azure API endpoints
          AZURE_OPENAI_ENDPOINT: http://mock-api
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: http://mock-api

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: services/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}-integration
          name: ${{ matrix.service }}-integration-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 3: Test Summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Check test results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        run: |
          echo "Unit tests: $UNIT_RESULT"
          echo "Integration tests: $INTEGRATION_RESULT"

          # Allow skipped tests, only fail on actual failures
          if [ "$UNIT_RESULT" = "failure" ] || [ "$INTEGRATION_RESULT" = "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi

          echo "✅ All tests passed"

      - name: Test results summary
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          REPO: ${{ github.repository }}
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | $UNIT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | $INTEGRATION_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 4 services tested: auth, inventory, ocr, recipe" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View full coverage report](https://codecov.io/gh/$REPO)" >> $GITHUB_STEP_SUMMARY
