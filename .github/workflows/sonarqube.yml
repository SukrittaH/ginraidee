name: SonarQube Scan
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: npm install
      - name: Install auth-service dependencies
        run: cd services/auth-service && npm install && cd ../..
      - name: Install inventory-service dependencies
        run: cd services/inventory-service && npm install && cd ../..
      - name: Install ocr-service dependencies
        run: cd services/ocr-service && npm install && cd ../..
      - name: Install recipe-service dependencies
        run: cd services/recipe-service && npm install && cd ../..
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}