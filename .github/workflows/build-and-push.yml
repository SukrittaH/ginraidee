name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      services:
        description: 'Services to build (comma-separated or "all")'
        required: true
        default: 'all'
        type: string

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Set build matrix
        id: set-matrix
        env:
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          if [ "$INPUT_SERVICES" = "all" ]; then
            echo 'matrix={"service":["auth-service","inventory-service","ocr-service","recipe-service"],"port":["3001","3002","3003","3004"]}' >> $GITHUB_OUTPUT
          else
            # Parse comma-separated services
            SERVICES=$(echo "$INPUT_SERVICES" | jq -R 'split(",") | map(ltrimstr(" ") | rtrimstr(" "))')
            echo "matrix={\"service\":$SERVICES}" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: prepare
    runs-on: [self-hosted, linux, azure, aks-deploy]
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (using runner VM managed identity)
        run: az login --identity

      - name: Login to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          echo "🔐 Logging in to ACR..."
          az acr login --name "$ACR_NAME"
          echo "✓ Logged in to ACR"

      - name: Set image tags
        id: tags
        env:
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          SERVICE_NAME: ${{ matrix.service }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "image=$REGISTRY/$SERVICE_NAME" >> $GITHUB_OUTPUT

          echo "📦 Image: $REGISTRY/$SERVICE_NAME"
          echo "🏷️  Tags: latest, $SHORT_SHA, $ENVIRONMENT"

      - name: Build Docker image
        env:
          SERVICE_NAME: ${{ matrix.service }}
          IMAGE_NAME: ${{ steps.tags.outputs.image }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          TIMESTAMP: ${{ steps.tags.outputs.timestamp }}
        run: |
          echo "🔨 Building $SERVICE_NAME..."

          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$SHORT_SHA" \
            -t "$IMAGE_NAME:$ENVIRONMENT" \
            -t "$IMAGE_NAME:$ENVIRONMENT-$TIMESTAMP" \
            -f "services/$SERVICE_NAME/Dockerfile" \
            services/

          echo "✓ Image built successfully"

      - name: Scan image with Trivy
        env:
          IMAGE_NAME: ${{ steps.tags.outputs.image }}
        run: |
          echo "🔍 Scanning image for vulnerabilities..."

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            "$IMAGE_NAME:latest"

          echo "✓ Vulnerability scan complete"

      - name: Check image size
        env:
          IMAGE_NAME: ${{ steps.tags.outputs.image }}
        run: |
          echo "📏 Checking image size..."

          SIZE=$(docker images "$IMAGE_NAME:latest" --format "{{.Size}}")
          SIZE_MB=$(docker images "$IMAGE_NAME:latest" --format "{{.Size}}" | sed 's/MB//' | sed 's/GB/*1024/' | bc 2>/dev/null || echo "0")

          echo "Image size: $SIZE"

          if [ "${SIZE_MB%.*}" -gt 500 ] 2>/dev/null; then
            echo "⚠️  Warning: Image is larger than 500MB"
          else
            echo "✓ Image size is acceptable"
          fi

      - name: Push to ACR
        env:
          IMAGE_NAME: ${{ steps.tags.outputs.image }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          TIMESTAMP: ${{ steps.tags.outputs.timestamp }}
        run: |
          echo "📤 Pushing images to ACR..."

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$SHORT_SHA"
          docker push "$IMAGE_NAME:$ENVIRONMENT"
          docker push "$IMAGE_NAME:$ENVIRONMENT-$TIMESTAMP"

          echo "✓ All tags pushed successfully"

      - name: Verify image in ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          echo "🔍 Verifying image in ACR..."

          az acr repository show \
            --name "$ACR_NAME" \
            --repository "$SERVICE_NAME" \
            --output table

          echo "✓ Image verified in ACR"

      - name: Build Summary
        env:
          SERVICE_NAME: ${{ matrix.service }}
          IMAGE_NAME: ${{ steps.tags.outputs.image }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          TIMESTAMP: ${{ steps.tags.outputs.timestamp }}
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════╗"
          echo "║  ✅ $SERVICE_NAME built successfully      ║"
          echo "╚════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Image: $IMAGE_NAME"
          echo "🏷️  Tags:"
          echo "  • latest"
          echo "  • $SHORT_SHA"
          echo "  • $ENVIRONMENT"
          echo "  • $ENVIRONMENT-$TIMESTAMP"

  summary:
    name: Build Summary
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build results
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICES: ${{ inputs.services }}
          GITHUB_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
        run: |
          echo "╔════════════════════════════════════════════════════╗"
          echo "║  Build and Push Summary                           ║"
          echo "╚════════════════════════════════════════════════════╝"
          echo ""
          echo "Environment: $ENVIRONMENT"
          echo "Services: $SERVICES"
          echo "Commit: $GITHUB_SHA"
          echo ""

          if [ "$BUILD_RESULT" = "success" ]; then
            echo "✅ All builds completed successfully!"
            echo ""
            echo "Next steps:"
            echo "  1. Review vulnerability scan results above"
            echo "  2. Run 'Deploy to AKS' workflow to deploy services"
            exit 0
          else
            echo "❌ Some builds failed. Check logs above."
            exit 1
          fi
