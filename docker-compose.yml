services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@host.docker.internal:5432/ginraidee
      - JWT_SECRET=dev-secret-key-change-in-production
      - ENTRAID_CLIENT_ID=f2f1830a-e181-44ed-aa95-e5c9f7d34c6b
      - ENTRAID_TENANT_ID=common
    ports:
      - "3001:3001"
    networks:
      - ginraidee-network
    volumes:
      - ./services/auth-service/src:/app/src

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:password@host.docker.internal:5432/ginraidee
      - JWT_SECRET=dev-secret-key-change-in-production
    ports:
      - "3002:3002"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - ginraidee-network
    volumes:
      - ./services/inventory-service/src:/app/src

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: ocr-service
    environment:
      - NODE_ENV=development
      - PORT=3003
      - JWT_SECRET=dev-secret-key-change-in-production
      - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
    ports:
      - "3003:3003"
    depends_on:
      - auth-service
    networks:
      - ginraidee-network
    volumes:
      - ./services/ocr-service/src:/app/src

  recipe-service:
    build:
      context: ./services/recipe-service
      dockerfile: Dockerfile
    container_name: recipe-service
    environment:
      - NODE_ENV=development
      - PORT=3004
      - JWT_SECRET=dev-secret-key-change-in-production
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME=gpt-4o
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
    ports:
      - "3004:3004"
    depends_on:
      - inventory-service
    networks:
      - ginraidee-network
    volumes:
      - ./services/recipe-service/src:/app/src

networks:
  ginraidee-network:
    driver: bridge
